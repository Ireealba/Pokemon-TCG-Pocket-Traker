<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Tracker</title>
<style>
:root{--bg:#14161c;--card:#1e222b;--tx:#e8eaf0;--mut:#8b93a5;--ok:#3ecf8e;--fav:#ffc83d;--wish:#ff6b9d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;border-bottom:1px solid #2a2f3a;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,button{background:var(--card);color:var(--tx);border:1px solid #2f3542;border-radius:8px;padding:8px 10px;font:inherit}
button{cursor:pointer}
#bar{flex:1 1 100%;height:8px;background:var(--card);border-radius:4px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
#info{flex:1 1 100%;color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:16px}
.c{position:relative;background:var(--card);border:3px solid var(--sc,#2a2f3a);border-radius:12px;overflow:hidden;cursor:pointer;user-select:none;box-shadow:0 0 10px -4px var(--sc,transparent)}
.c .im{position:relative}
.c img.card{display:block;width:100%;aspect-ratio:245/337;object-fit:cover;background:#2a2f3a}
.c.m img.card{filter:grayscale(1) brightness(.45)}
.n{position:absolute;top:6px;right:6px;background:var(--ok);color:#06210f;font-weight:700;border-radius:999px;padding:1px 8px;font-size:13px}
.tl{position:absolute;top:6px;left:6px;display:flex;gap:4px}
.b{width:28px;height:28px;padding:0;border-radius:50%;background:rgba(20,22,28,.78);border:1px solid #ffffff22;font-size:15px;line-height:1;color:#c9cedb;display:flex;align-items:center;justify-content:center}
.b.fav.on{color:var(--fav);border-color:var(--fav)}
.b.wish.on{color:var(--wish);border-color:var(--wish)}
.b.d{position:absolute;right:6px;bottom:6px;font-weight:700;font-size:18px}
.inf{padding:5px 7px 6px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.inf div{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inf .nm{color:var(--tx);font-size:13px}
.inf img{width:16px;height:16px;flex:none}
.inf .sp{margin-left:auto;font-weight:700;color:var(--sc)}
#more{grid-column:1/-1;height:1px}
@media(max-width:520px){main{grid-template-columns:repeat(2,1fr);padding:10px;gap:8px}}
</style>
</head>
<body>
<header>
  <select id="set"></select>
  <input id="q" type="search" placeholder="Buscar nombre o nº…">
  <select id="f">
    <option value="all">Todas</option><option value="own">Las tengo</option><option value="miss">Me faltan</option>
    <option value="wish">♥ Wishlist</option><option value="fav">★ Favoritas</option>
  </select>
  <select id="t"></select>
  <select id="v"></select>
  <select id="r"><option value="">Todas las rarezas</option></select>
  <select id="l"><option value="es">Español</option><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option></select>
  <button id="ex">Exportar</button><button id="im">Importar</button><input id="file" type="file" accept=".json" hidden>
  <div id="bar"><i></i></div>
  <div id="info"></div>
</header>
<main id="grid"></main>

let sets = [], bySet = {}, cur = 'all', lim = 300;

/* Color por expansión: ángulo áureo para que expansiones consecutivas se distingan */
const KNOWN = ['A1','A1a','A2','A2a','A2b','A3','A3a','A3b','A4','A4a','A4b','B1','B1a','B2','B2a','B2b','B3','B3a','B3b','B4','B4a','B4b','P-A','P-B'];
function setColor(id){
  let i = KNOWN.indexOf(id);
  if (i < 0) { i = 0; for (const ch of id) i = (i * 31 + ch.charCodeAt(0)) % 997; i += KNOWN.length; }
  return `hsl(${Math.round((i * 137.508) % 360)} 68% 58%)`;
}

const NUM = { one: 1, two: 2, three: 3, four: 4 };
function sym(r) {
  if (!r || r === '-' || /^none$/i.test(r)) return '';
  let m = r.match(/(one|two|three|four)\s+diamond/i); if (m) return '♢'.repeat(NUM[m[1].toLowerCase()]);
  m = r.match(/(one|two|three)\s+star/i); if (m) return '☆'.repeat(NUM[m[1].toLowerCase()]);
  m = r.match(/(one|two)\s+shiny/i); if (m) return '✷'.repeat(NUM[m[1].toLowerCase()]);
  if (/crown/i.test(r)) return '♛';
  return r;
}
const rOf = c => { const m = metaOf(c.id); return (m && m.r) || sym(rar[c.id]); };

const viewCards = () => cur === 'all' ? sets.flatMap(s => bySet[s.id] || []) : (bySet[cur] || []);

function fillSets() {
  const cnt = {}; let all = 0;
  for (const k in own) if (own[k] > 0) { const s = k.slice(0, k.lastIndexOf('-')); cnt[s] = (cnt[s] || 0) + 1; all++; }
  const tot = sets.reduce((a, s) => a + (s.cardCount?.total ?? 0), 0);
  $('#set').innerHTML = `<option value="all">Todas las expansiones (${all}/${tot || '?'})</option>` +
    sets.map(s => `<option value="${esc(s.id)}">${esc(s.name)} (${cnt[s.id] || 0}/${s.cardCount?.total ?? '?'})</option>`).join('');
  $('#set').value = cur;
}

function fillFilters() {
  const pt = $('#t').value, pv = $('#v').value;
  $('#t').innerHTML = '<option value="">Todos los tipos</option>' + TYPES.map((n, i) => `<option value="${i}">${esc(n)}</option>`).join('');
  $('#v').innerHTML = '<option value="">Todas las variantes</option>' + VARS.map((n, i) => `<option value="${i}">${esc(n)}</option>`).join('');
  $('#t').value = pt; $('#v').value = pv;
}

function buildRar() {
  const prev = $('#r').value;
  const set = new Set(viewCards().map(rOf).filter(Boolean));
  const list = [...set].sort((a, b) => (RORDER.indexOf(a) + 99 * (RORDER.indexOf(a) < 0)) - (RORDER.indexOf(b) + 99 * (RORDER.indexOf(b) < 0)));
  $('#r').innerHTML = '<option value="">Todas las rarezas</option>' + list.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
  $('#r').value = list.includes(prev) ? prev : '';
}

function render(reset) {
  if (reset) lim = 300;
  const q = $('#q').value.toLowerCase(), f = $('#f').value, r = $('#r').value, t = $('#t').value, v = $('#v').value;
  const base = viewCards();
  const list = base.filter(c => {
    if (q && !c.n.toLowerCase().includes(q) && !c.id.toLowerCase().includes(q)) return false;
    const n = own[c.id] > 0;
    if (f === 'own' && !n) return false;
    if (f === 'miss' && n) return false;
    if (f === 'wish' && !(wish[c.id] && !n)) return false;
    if (f === 'fav' && !fav[c.id]) return false;
    if (r && rOf(c) !== r) return false;
    if (t !== '' || v !== '') {
      const m = metaOf(c.id); if (!m) return false;
      if (t !== '' && m.t !== +t) return false;
      if (v !== '' && m.v !== +v) return false;
    }
    return true;
  });
  $('#grid').innerHTML = list.slice(0, lim).map(c => {
    const n = own[c.id] || 0, m = metaOf(c.id), rr = rOf(c);
    const isFav = !!fav[c.id], isWish = !!wish[c.id];
    return `<div class="c${n ? '' : ' m'}" data-id="${esc(c.id)}" style="--sc:${setColor(c.s)}">` +
      `<div class="im">` +
      (c.i ? `<img class="card" loading="lazy" src="${esc(c.i)}/low.webp" alt="${esc(c.n)}">` : '<img class="card" alt="">') +
      `<div class="tl"><button class="b fav${isFav ? ' on' : ''}" data-a="fav" title="Favorita">${isFav ? '★' : '☆'}</button>` +
      (n ? '' : `<button class="b wish${isWish ? ' on' : ''}" data-a="wish" title="Wishlist">${isWish ? '♥' : '♡'}</button>`) + `</div>` +
      (n ? `<span class="n">×${n}</span><button class="b d" data-a="dec" title="Quitar una copia">−</button>` : '') +
      `</div><div class="inf">` +
      `<div class="nm">${m ? `<img src="${D.icons[m.t]}" alt="" title="${esc(TYPES[m.t])}">` : ''}${esc(c.id.split('-').pop())} ${esc(c.n)}</div>` +
      `<div>${m ? `${D.vemoji[m.v]} ${esc(VARS[m.v])}` : ''}${rr ? ` · ${esc(rr)}` : ''}<span class="sp">${esc(c.s)}</span></div>` +
      `</div></div>`;
  }).join('') + (list.length > lim ? '<div id="more"></div>' : '');
  const tot = base.length, have = base.filter(c => own[c.id] > 0).length, pct = tot ? Math.round(have / tot * 100) : 0;
  const nf = base.filter(c => fav[c.id]).length, nw = base.filter(c => wish[c.id] && !(own[c.id] > 0)).length;
  $('#bar i').style.width = pct + '%';
  if (!loadingMsg) $('#info').textContent = `${have}/${tot} cartas (${pct}%) · ★ ${nf} · ♥ ${nw} · mostrando ${Math.min(lim, list.length)}/${list.length}`;
  fillSets();
  watchMore();
}

let io;
function watchMore() {
  const el = $('#more'); if (!el) return;
  io ??= new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { lim += 300; render(); } }, { rootMargin: '600px' });
  io.disconnect(); io.observe(el);
}

let loadingMsg = '';
async function loadRar() {
  const todo = viewCards().map(c => c.id).filter(i => !metaOf(i)?.r && !rar[i]);
  let k = 0, done = 0;
  await Promise.all(Array.from({ length: 6 }, async () => {
    while (k < todo.length) {
      const id = todo[k++];
      try { rar[id] = (await getJ(`${API}en/cards/${id}`)).rarity || '-'; } catch {}
      if (++done % 20 === 0) $('#info').textContent = `Cargando rarezas ${done}/${todo.length}…`;
    }
  }));
  if (todo.length) { put('pt.rar', rar); buildRar(); render(); }
}

async function ensureSet(id) {
  if (bySet[id]) return;
  const key = `pt.set.${lang}.${id}`;
  let s = load(key, null);
  if (!s) {
    const d = await getJ(`${API}${lang}/sets/${id}`);
    s = { cards: d.cards.map(c => ({ id: c.id, n: c.name, i: c.image })) };
    put(key, s);
  }
  bySet[id] = s.cards.map(c => ({ ...c, s: id }));
}

async function loadAll() {
  let k = 0, done = 0; const ids = sets.map(s => s.id);
  loadingMsg = 'x';
  await Promise.all(Array.from({ length: 4 }, async () => {
    while (k < ids.length) {
      const id = ids[k++];
      try { await ensureSet(id); } catch {}
      $('#info').textContent = `Cargando expansiones ${++done}/${ids.length}…`;
      if (cur === 'all' && done % 4 === 0) render();
    }
  }));
  loadingMsg = '';
  buildRar(); render(); loadRar();
}

async function init() {
  $('#l').value = lang; fillFilters();
  $('#info').textContent = 'Cargando…';
  bySet = {}; cur = 'all';
  try { sets = (await getJ(`${API}${lang}/series/tcgp`)).sets; }
  catch (e) { $('#info').textContent = 'No se pudo cargar la API: ' + e.message; return; }
  fillSets(); render(true);
  await loadAll();
}

$('#grid').onclick = e => {
  const el = e.target.closest('.c'); if (!el) return;
  const id = el.dataset.id, a = e.target.closest('button')?.dataset.a;
  if (a === 'fav') { fav[id] ? delete fav[id] : fav[id] = 1; put('pt.fav', fav); }
  else if (a === 'wish') { wish[id] ? delete wish[id] : wish[id] = 1; put('pt.wish', wish); }
  else {
    own[id] = Math.max(0, (own[id] || 0) + (a === 'dec' ? -1 : 1));
    if (!own[id]) delete own[id];
    else if (wish[id]) { delete wish[id]; put('pt.wish', wish); }   // ya la tienes: fuera de la wishlist
    put('pt.own', own);
  }
  render();
};
$('#set').onchange = async e => {
  cur = e.target.value;
  if (cur !== 'all' && !bySet[cur]) { $('#info').textContent = 'Cargando…'; try { await ensureSet(cur); } catch (err) { $('#info').textContent = 'Error: ' + err.message; return; } }
  buildRar(); render(true); loadRar();
};
$('#q').oninput = () => render(true);
$('#f').onchange = $('#r').onchange = $('#t').onchange = $('#v').onchange = () => render(true);
$('#l').onchange = e => { lang = e.target.value; put('pt.lang', lang); init(); };
$('#ex').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ v: 2, own, fav, wish })], { type: 'application/json' }));
  a.download = 'pocket-collection.json'; a.click();
};
$('#im').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text()); if (typeof d !== 'object' || !d) throw 0;
    if (d.v === 2) { own = d.own || {}; fav = d.fav || {}; wish = d.wish || {}; }   // formato nuevo
    else own = d;                                                                    // formato antiguo (solo copias)
    put('pt.own', own); put('pt.fav', fav); put('pt.wish', wish); render(true);
  } catch { alert('Archivo no válido'); }
};
init();
</script>
</body>
</html>
